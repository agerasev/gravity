<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gravity</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #000; }
    #content { width: 100%; height: 100%; contain: size; }
    /* winit's ResizeObserver tracks the viewport-sized CSS canvas. */
    canvas { display: block; width: 100% !important; height: 100% !important; outline: none; touch-action: none; }
  </style>
  <link data-trunk rel="rust" data-bin="gravity" />
  <link data-trunk rel="copy-file" href="assets/DejaVuSans-LICENSE.txt" />
</head>
<body>
  <div id="content"><canvas id="canvas" tabindex="0" aria-label="Gravity sandbox; N switches pan and launch tools, Space pauses, P opens controls"></canvas></div>
  <noscript>Gravity requires JavaScript and WebGL2.</noscript>
</body>
</html>
